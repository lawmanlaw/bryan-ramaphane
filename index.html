<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming soon</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#012f3c">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
  :root { --deep: #012f3c; --lime: #c7ec7a; --deep-ink: #f1f6ec; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--deep); color: var(--deep-ink);
    font-family: "Newsreader", Georgia, serif;
    display: grid; place-items: center; padding: 24px;
    -webkit-tap-highlight-color: transparent;
  }
  main { text-align: center; }
  .mark { position: relative; width: 84px; height: 84px; margin: 0 auto 26px; }
  .mark .ltr {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 39px; line-height: 1; padding-bottom: 8px;
  }
  .mark .rule {
    position: absolute; left: 23.6px; bottom: 14.7px;
    width: 36.8px; height: 3.4px; background: var(--lime);
  }
  p { margin: 0; font-size: clamp(17px, 4vw, 20px); letter-spacing: .01em; opacity: .82; }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <span class="ltr"><span>B</span><span>R</span></span>
      <span class="rule"></span>
    </div>
    <p>Coming soon</p>
  </main>
</body>
</html>
